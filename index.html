<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Nairaa ❤️</title>
<style>
*{
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    margin:0;
    background:linear-gradient(135deg,#ff77b7,#ffd6ec);
    overflow-x:hidden;
    text-align:center;
    color:white;
}

#open{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

#open h1{
    font-size:35px;
    animation:glow 2s infinite alternate;
}

.openBtn{
    padding:15px 35px;
    border:none;
    border-radius:50px;
    background:#ff1493;
    color:white;
    font-size:20px;
    cursor:pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.openBtn:hover {
    transform: scale(1.05);
}

.container{
    display:none;
    padding:20px;
    min-height: 100vh;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.title{
    font-size:40px;
    animation:glow 2s infinite alternate;
}

@keyframes glow{
    from{
        text-shadow:0 0 10px white;
    }
    to{
        text-shadow:0 0 35px #ff0080;
    }
}

.cake{
    font-size:100px;
    margin: 20px 0;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    50%{
        transform:translateY(-20px);
    }
}

.card{
    background:white;
    color:#d63384;
    padding:25px;
    margin-top:25px;
    border-radius: 20px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}
</style>
</head>
<body>

    <!-- First Screen -->
    <div id="open">
        <h1>For Nairaa ❤️</h1>
        <button class="openBtn" onclick="openGift()">Open Surprise</button>
    </div>

    <!-- Main Birthday Content -->
    <div class="container" id="mainContent">
        <div class="title">Happy Birthday Nairaa! 🎉</div>
        <div class="cake">🎂</div>
        <div class="card">
            <h2>Wishing you a day as special as you are!</h2>
            <p>May your life be filled with endless happiness, love, and smiles. Have the best birthday ever! ❤️</p>
        </div>
    </div>

    <script>
        function openGift() {
            document.getElementById('open').style.display = 'none';
            document.getElementById('mainContent').style.display = 'flex';
        }
    </script>

</body>
</html>
