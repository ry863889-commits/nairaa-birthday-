<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Nairaa ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:linear-gradient(135deg,#ff4e8a,#ff9acb);
font-family:Arial,sans-serif;
overflow:hidden;
text-align:center;
color:white;
}

.container{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
}

h1{
font-size:45px;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{
text-shadow:0 0 10px white;
}
to{
text-shadow:0 0 30px yellow,0 0 50px white;
}
}

p{
font-size:20px;
margin-top:15px;
}

button{
margin-top:30px;
padding:15px 30px;
font-size:22px;
border:none;
border-radius:50px;
background:#ff0066;
color:white;
cursor:pointer;
box-shadow:0 0 20px #fff;
}

button:hover{
transform:scale(1.08);
}
</style>
</head>

<body>

<div class="container">

<h1>🎉 Happy Birthday Nairaa 🎉</h1>

<p>Tap the button to blow the candles 🕯️</p>

<button onclick="startParty()">Blow Candles 🎂</button>

<div id="party"></div>
<style>
.cake{
margin-top:40px;
position:relative;
width:180px;
height:160px;
}

.layer1{
width:180px;
height:50px;
background:#ffb347;
border-radius:10px;
position:absolute;
bottom:0;
}

.layer2{
width:150px;
height:45px;
background:#ff8fab;
border-radius:10px;
position:absolute;
left:15px;
bottom:50px;
}

.layer3{
width:120px;
height:40px;
background:#fff176;
border-radius:10px;
position:absolute;
left:30px;
bottom:95px;
}

.candle{
width:12px;
height:45px;
background:white;
position:absolute;
left:84px;
bottom:135px;
border-radius:5px;
}

.flame{
width:16px;
height:22px;
background:orange;
border-radius:50%;
position:absolute;
left:82px;
bottom:178px;
animation:flicker .5s infinite alternate;
}

@keyframes flicker{
from{transform:scale(1);}
to{transform:scale(1.2);}
}
</style>

<div class="cake">
<div class="layer1"></div>
<div class="layer2"></div>
<div class="layer3"></div>
<div class="candle"></div>
<div class="flame" id="flame"></div>
</div>
<script>
function startParty(){

// Blow candle
document.getElementById("flame").style.display="none";

// Confetti
for(let i=0;i<120;i++){

let c=document.createElement("div");

c.innerHTML="🎉";

c.style.position="fixed";
c.style.left=Math.random()*100+"vw";
c.style.top="-20px";
c.style.fontSize=(20+Math.random()*20)+"px";
c.style.animation="fall "+(2+Math.random()*3)+"s linear forwards";

document.body.appendChild(c);

setTimeout(()=>c.remove(),5000);
}

// Music
let audio=new Audio("https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3");
audio.play();

// Message
setTimeout(()=>{
alert("🎂 Happy Birthday Nairaa ❤️\n\nMay all your dreams come true! 🎉");
},1000);

}

</script>

<style>
@keyframes fall{
0%{
transform:translateY(-20px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(110vh) rotate(720deg);
opacity:0;
}
}
</style>

</div>
</body>
</html>
